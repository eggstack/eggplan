[workspace]
resolver = "2"
members = ["crates/eggplan-core", "crates/eggplan-repo"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
fs2 = "0.4"
git2 = { version = "0.20", default-features = false }
tempfile = "3.23"
toml = "0.9"
